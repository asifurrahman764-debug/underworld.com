
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #333; }
        .header { text-align: center; background: #222; color: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .products { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: #fff; width: 250px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .price { font-size: 18px; color: #e67e22; font-weight: bold; margin: 10px 0; }
        .btn { display: inline-block; background-color: #25D366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 5px; }
        .btn:hover { background-color: #1eb854; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Welcome to Underworld</h1>
        <p>অর্ডার করতে সরাসরি WhatsApp-এ যোগাযোগ করুন</p>
    </div>

    <div class="products">
        <!-- প্রোডাক্ট ১ -->
        <div class="card">
            <img src="https://via.placeholder.com/250x200" alt="Product 1">
            <h3>T-Shirt Classic</h3>
            <p class="price">৳ ৫০০</p>
            <!-- আপনার মোবাইল নম্বর ০XXXXXXXXXX এর জায়গায় বসিয়ে দিন -->
            <a href="https://wa.me/8801XXXXXXXXX?text=I%20want%20to%20order%20T-Shirt%20Classic" target="_blank" class="btn">WhatsApp-এ অর্ডার করুন</a>
        </div>

        <!-- প্রোডাক্ট ২ -->
        <div class="card">
            <img src="https://via.placeholder.com/250x200" alt="Product 2">
            <h3>Stylish Shoes</h3>
            <p class="price">৳ ১,৫০০</p>
            <a href="https://wa.me/8801XXXXXXXXX?text=I%20want%20to%20order%20Stylish%20Shoes" target="_blank" class="btn">WhatsApp-এ অর্ডার করুন</a>
        </div>
    </div>

</body>
</html>
